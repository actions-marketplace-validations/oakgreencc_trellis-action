name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bump semver from conventional commits since the last vX.Y.Z tag:
      # BREAKING CHANGE / "type!:" → major, feat → minor, fix/perf → patch.
      # Anything else (chore, docs, ci, …) cuts no release.
      - id: bump
        run: |
          set -euo pipefail
          prev=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          range=${prev:+$prev..HEAD}
          log=$(git log --format='%s%n%b' "${range:-HEAD}")
          subjects=$(git log --format='%s' "${range:-HEAD}")

          bump=none
          if grep -qE '^BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:' <<<"$log"; then bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then bump=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<<"$subjects"; then bump='patch'
          fi
          echo "prev=${prev:-none} bump=$bump"
          if [ "$bump" = none ]; then exit 0; fi

          IFS=. read -r major minor patch <<<"${prev#v}"
          : "${major:=0}" "${minor:=0}" "${patch:=0}"
          case $bump in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          {
            echo "tag=v$major.$minor.$patch"
            echo "major=v$major"
            echo "prev=${prev:-}"
          } >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          MAJOR: ${{ steps.bump.outputs.major }}
          PREV: ${{ steps.bump.outputs.prev }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "$TAG"
          git tag -f "$MAJOR" "$TAG"          # floating major tag → uses: …@v1
          git push origin "$TAG"
          git push -f origin "$MAJOR"
          gh release create "$TAG" --title "$TAG" --generate-notes \
            ${PREV:+--notes-start-tag "$PREV"}
