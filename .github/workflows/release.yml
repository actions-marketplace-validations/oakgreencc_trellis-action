name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bump semver from conventional commits since the last tag and push
      # the vX.Y.Z tag. No feat/fix/BREAKING commits → no tag, no release.
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          initial_version: 0.0.0

      - if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true

      # Keep the floating major tag (v1, v2, …) pointing at the latest release
      # so consumers can `uses: oakgreencc/trellis-action@v1`.
      - if: steps.tag.outputs.new_tag != ''
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "$major"
